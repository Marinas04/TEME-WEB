<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Preferințe</title>
    <style>
        body { transition: 0.3s; font-family: sans-serif; padding: 20px; }
        
        /* ACESTEA SUNT CELE DOUĂ CLASE CRITICE */
        body.light { background-color: #ffffff !important; color: #000000 !important; }
        body.dark { background-color: #1a1a1a !important; color: #ffffff !important; }
        
        .container { 
            max-width: 600px; margin: 0 auto; padding: 20px; 
            border: 1px solid #ccc; border-radius: 8px; 
        }
        body.dark .container { background-color: #333; border-color: #555; }
        select, button { padding: 10px; margin-top: 10px; width: 100%; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body class="light">

    <div class="container">
        <h2 id="title">Setări Preferințe</h2>
        <form id="p-form">
            <label>Temă:</label>
            <select id="p-theme">
                <option value="light">Luminos</option>
                <option value="dark">Întunecat</option>
            </select>

            <label style="display:block; margin-top:15px;">Limbă:</label>
            <select id="p-lang">
                <option value="ro">Română</option>
                <option value="en">English</option>
            </select>

            <button type="submit">Salvează</button>
        </form>
    </div>

    <script src="js/cookies.js"></script>
    <script src="js/storage.js"></script>

    <script>
        function apply() {
            // Citim tema
            const t = CookieManager.get('theme') || 'light';
            document.body.className = t; // Schimbă clasa body-ului
            document.getElementById('p-theme').value = t;

            // Citim limba
            const l = StorageManager.getLocal('lang') || 'ro';
            document.getElementById('p-lang').value = l;
            document.getElementById('title').innerText = (l === 'en') ? "Settings" : "Setări Preferințe";
        }

        window.onload = apply;

        document.getElementById('p-form').onsubmit = (e) => {
            e.preventDefault();
            const selectedT = document.getElementById('p-theme').value;
            const selectedL = document.getElementById('p-lang').value;

            // Salvăm
            CookieManager.set('theme', selectedT, 30);
            StorageManager.setLocal('lang', selectedL);

            // Aplicăm imediat
            apply();
            alert("Salvat!");
        };
    </script>
</body>
</html>
